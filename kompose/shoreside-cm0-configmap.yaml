  CMakeLists.txt: "#=======================================================================\n# FILE:  moos-ivp-2.680/CMakeLists.txt\n# DATE:  May 2023\n# INFO:  Top-level CMakeLists.txt file for the moos-ivp-2.680 project\n# NAME:  Maintained by Mike Benjamin\n#=======================================================================\n\nCMAKE_MINIMUM_REQUIRED(VERSION 3.10)\nPROJECT( IVP_EXTEND )\n\nset (CMAKE_CXX_STANDARD 11)\n\n#=======================================================================\n# Set the output directories for the binary and library files\n#=======================================================================\n\nGET_FILENAME_COMPONENT(IVP_EXTEND_BIN_DIR \"${CMAKE_SOURCE_DIR}/bin\"  ABSOLUTE )\nGET_FILENAME_COMPONENT(IVP_EXTEND_LIB_DIR \"${CMAKE_SOURCE_DIR}/lib\"  ABSOLUTE )\n\nSET( LIBRARY_OUTPUT_PATH      \"${IVP_EXTEND_LIB_DIR}\" CACHE PATH \"\" )\nSET( ARCHIVE_OUTPUT_DIRECTORY \"${IVP_EXTEND_LIB_DIR}\" CACHE PATH \"\" )\nSET( LIBRARY_OUTPUT_DIRECTORY \"${IVP_EXTEND_LIB_DIR}\" CACHE PATH \"\" )\n\nSET( EXECUTABLE_OUTPUT_PATH    \"${IVP_EXTEND_BIN_DIR}\" CACHE PATH \"\" )\nSET( RUNTIME_OUTPUT_DIRECTORY \"${IVP_EXTEND_BIN_DIR}\"  CACHE PATH \"\" )\n\n#=======================================================================\n# Find MOOS\n#=======================================================================\nfind_package(MOOS 10.0)\nINCLUDE_DIRECTORIES(${MOOS_INCLUDE_DIRS})\n\n#=============================================================================\n# FINDING MOOSGeodesy' HEADERS AND LIBRARIES...\n#=============================================================================\nfind_package(MOOSGeodesy)\ninclude_directories(${MOOSGeodesy_INCLUDE_DIRS})\nlink_directories(${MOOSGeodesy_LIBRARY_PATH})\n\nmessage(\"+++++++++++++++++++++++++++++++++++++++++\")\nmessage(\"MOOSGeodesy_INCLUDE_DIRS:\" ${MOOSGeodesy_INCLUDE_DIRS})\nmessage(\"MOOSGeodesy_LIBRARY_PATH:\" ${MOOSGeodesy_LIBRARY_PATH})\nmessage(\"+++++++++++++++++++++++++++++++++++++++++\")\n\n#=======================================================================\n# Find the \"moos-ivp\" base directory\n#=======================================================================\n\n# Search for the moos-ivp folder\nfind_path( MOOSIVP_SOURCE_TREE_BASE\n           NAMES build-ivp.sh build-moos.sh configure-ivp.sh\n           PATHS \"../moos-ivp\" \"../../moos-ivp\" \"../../moos-ivp/trunk/\" \"../moos-ivp/trunk/\"\n           DOC \"Base directory of the MOOS-IvP source tree\"\n           NO_DEFAULT_PATH\n)\n\nif (NOT MOOSIVP_SOURCE_TREE_BASE)\n    message(\"Please set MOOSIVP_SOURCE_TREE_BASE to  \")\n    message(\"the location of the \\\"moos-ivp\\\" folder \")\n    return()\nendif()\n\n#======================================================================\n# Specify where to find IvP's headers and libraries...\n#======================================================================\n\nFILE(GLOB IVP_INCLUDE_DIRS ${MOOSIVP_SOURCE_TREE_BASE}/ivp/src/lib_* )\nINCLUDE_DIRECTORIES(${IVP_INCLUDE_DIRS})\n\nFILE(GLOB IVP_LIBRARY_DIRS ${MOOSIVP_SOURCE_TREE_BASE}/lib )\nLINK_DIRECTORIES(${IVP_LIBRARY_DIRS})\n\n#=============================================================================\n# Tell CMake (and thus C++) where to find IvP's header files...\n#=============================================================================\n\nIF( EXISTS /usr/local/include AND EXISTS /usr/local/lib )\n  INCLUDE_DIRECTORIES(/usr/local/include)\n  LINK_DIRECTORIES(/usr/local/lib)\nENDIF()\n\nIF( EXISTS /opt/local/include AND EXISTS /opt/local/lib )\n  INCLUDE_DIRECTORIES(/opt/local/include)\n  LINK_DIRECTORIES(/opt/local/lib)\nENDIF()\n\nIF( EXISTS /opt/homebrew/include AND EXISTS /opt/homebrew/lib )\n  INCLUDE_DIRECTORIES(/opt/homebrew/include)\n  LINK_DIRECTORIES(/opt/homebrew/lib)\nENDIF()\n\n\n#======================================================================\n# Specify Compiler Flags\n#======================================================================\nIF( ${WIN32} )\n   #---------------------------------------------\n   # Windows Compiler Flags\n   #---------------------------------------------\n   IF(MSVC)\n      # Flags for Microsoft Visual Studio\n      SET( WALL_ON OFF CACHE BOOL \n         \"tell me about all compiler warnings (-Wall) \")\n      IF(WALL_ON)\n         SET(CMAKE_CXX_FLAGS \"${CMAKE_CXX_FLAGS} -Wall\")\n      ENDIF(WALL_ON)\n   ELSE(MSVC)\n      # Other Windows compilers go here\n   ENDIF(MSVC)\n\nELSE( ${WIN32} )\n   #---------------------------------------------\n   # Linux and Apple Compiler Flags\n   #---------------------------------------------\n   # Force -fPIC because gcc complains when we don't use it with x86_64 code.\n   # Note sure why: -fPIC should only be needed for shared objects, and\n   # AFAIK, CMake gets that right when building shared objects. -CJC\n   SET(CMAKE_CXX_FLAGS \"${CMAKE_CXX_FLAGS} -fPIC -g -Wdeprecated-declarations\")\n   IF(CMAKE_COMPILER_IS_GNUCXX)\n      # Flags for the GNU C++ Compiler\n      SET( WALL_ON OFF CACHE BOOL \n         \"tell me about all compiler warnings (-Wall) \")\n      IF(WALL_ON)\n         SET(CMAKE_CXX_FLAGS \"${CMAKE_CXX_FLAGS} -Wall\" -C++11)\n      ENDIF( WALL_ON)\n   ELSE(CMAKE_COMPILER_IS_GNUCXX)\n    \n   ENDIF(CMAKE_COMPILER_IS_GNUCXX)\n\nENDIF( ${WIN32} )\n\n#=======================================================================\n# Add Subdirectories\n#=======================================================================\nADD_SUBDIRECTORY( src )\n"
  README: "##############################################################################\n# FILE:        moos-ivp-2680/README\n# DATE:        May 2023\n# DESCRIPTION: Contains info regarding the moos-ivp-2680 repository.\n##############################################################################\n\n#=============================================================================\n# Introduction\n#=============================================================================\nThe moos-ivp-2680 repository contains code and missions for use in the MIT\nClass 2.680 Marine Autonomy, Sensing and Communications.\n\n#=============================================================================\n# Directory Structure\n#=============================================================================\nThe directory structure for the moos-ivp-extend is decribed below:\n\nbin              - Directory for generated executable files\nbuild            - Directory for build object files\nbuild.sh         - Script for building moos-ivp-extend\nCMakeLists.txt   - CMake configuration file for the project\ndata             - Directory for storing data\nlib              - Directory for generated library files\nmissions         - Directory for mission files\nREADME           - Contains helpful information - (this file).\nscripts          - Directory for script files\nsrc              - Directory for source code\n\n#=============================================================================\n# Build Instructions\n#=============================================================================\n#--------------------\n# Linux and Mac Users\n#--------------------\n\nTo build on Linux and Apple platforms, execute the build script within this\ndirectory:\n\n   $ ./build.sh\n\nTo build without using the supplied script, execute the following commands\nwithin this directory:\n\n   $ mkdir -p build\n   $ cd build\n   $ cmake ../\n   $ make\n   $ cd ..\n\n#--------------\n# Windows Users\n#--------------\nWindows is not supported for the 2.680 codebase\n\n#=============================================================================\n# Environment variables\n#=============================================================================\nThe moos-ivp-2680 binaries files should be added to your path to allow them\nto be launched from pAntler. \n\nFor IvP Behaviors to be recognized by the IvP Helm, you should add the library\ndirectory to the \"IVP_BEHAVIOR_DIRS\" environment variable.\n\n##############################################################################\n#                               END of README\n##############################################################################\n\n"
  build.sh: "#!/bin/bash\n\n#----------------------------------------------------------                               \n#  Script: build.sh                                                                      \n#  Author: Michael Benjamin                                                               \n#---------------------------------------------------------- \n\nINVOCATION_ABS_DIR=`pwd`\nBUILD_TYPE=\"None\"\nCMD_LINE_ARGS=\"\"\nBUILD_BOT_CODE_ONLY=\"OFF\"\n\n#-------------------------------------------------------------------\n#  Part 1: Check for and handle command-line arguments\n#-------------------------------------------------------------------\nfor ARGI; do\n    if [ \"${ARGI}\" = \"--help\" -o \"${ARGI}\" = \"-h\" ]; then\n\techo \"build.sh [SWITCHES]                 \" \n\techo \"Switches:                           \" \n\techo \"  --help, -h                        \" \n        echo \"  --debug,   -d                     \"\n        echo \"  --release, -r                     \"\n\techo \"  --minrobot, -m                           \"\n\techo \"    Only build minimal robot apps          \"\n\techo \"  --minrobotx, -mx                         \"\n\techo \"    Override min-robot default on Raspbian \"\n\techo \"Notes:                              \"\n\techo \" (1) All other command line args will be passed as args    \"\n\techo \"     to \\\"make\\\" when it is eventually invoked.            \"\n\techo \" (2) For example -k will continue making when/if a failure \"\n\techo \"     is encountered in building one of the subdirectories. \"\n\techo \" (3) For example -j2 will utilize a 2nd core in the build  \"\n\techo \"     if your machine has two cores. -j4 etc for quad core. \"\n\texit 0;\n    elif [ \"${ARGI}\" = \"--debug\" -o \"${ARGI}\" = \"-d\" ]; then\n        BUILD_TYPE=\"Debug\"\n    elif [ \"${ARGI}\" = \"--release\" -o \"${ARGI}\" = \"-r\" ]; then\n        BUILD_TYPE=\"Release\"\n    elif [ \"${ARGI}\" = \"--minrobot\" -o \"${ARGI}\" = \"-m\" ]; then\n        BUILD_BOT_CODE_ONLY=\"ON\"\n    elif [ \"${ARGI}\" = \"--minrobotx\" -o \"${ARGI}\" = \"-mx\" ]; then\n        FORCE_FULL_RASPI_BUILD=\"yes\"\n    else\n\tCMD_LINE_ARGS=$CMD_LINE_ARGS\" \"$ARGI\n    fi\ndone\n\n#-------------------------------------------------------------- \n#  Part 2: If this is Raspbian and minrobot not selected, and\n#          no explicit override given with -mx, CONFIRM first\n#-------------------------------------------------------------- \ncommand -v raspi-gpio\nif [ \"$?\" = \"0\" -a \"${BUILD_BOT_CODE_ONLY}\" = \"OFF\" ]; then\n    if [ ! \"${FORCE_FULL_RASPI_BUILD}\" = \"yes\" ]; then\n\techo \"Pi OS detected without --minrobotx or -mx selected.\"\n\techo \"[y] Continue with full build\"\n\techo \"[M] Continue with minrobot build\"\n\techo -n \"Continue? [y/M] \"\n\tread ANSWER\n\tif [ ! \"${ANSWER}\" = \"y\" ]; then\n\t    BUILD_BOT_CODE_ONLY=\"ON\"\n\tfi\n    fi\nfi\n\t\n#---------------------------------------------------------\n# Part 2: Set Compiler flags\n#---------------------------------------------------------\nCMAKE_CXX_FLAGS=\"-Wall -Wextra -Wno-unused-parameter \"\nCMAKE_CXX_FLAGS+=\"-Wno-missing-field-initializers -pedantic -fPIC \"\nCMAKE_CXX_FLAGS+=\"-Wno-deprecated-declarations \"\nCMAKE_CXX_FLAGS+=\"-Wno-c++11-extra-semi \" \n\n#-------------------------------------------------------------------\n#  Part 3: Invoke the call to make in the build directory\n#-------------------------------------------------------------------\n\nmkdir -p build\ncd build\n\ncmake -DCMAKE_CXX_FLAGS=\"${CMAKE_CXX_FLAGS}\"       \\\n      -DBUILD_BOT_CODE_ONLY=${BUILD_BOT_CODE_ONLY} \\\n      -DCMAKE_BUILD_TYPE=${BUILD_TYPE} ../\n\nmake ${CMD_LINE_ARGS}\ncd ${INVOCATION_ABS_DIR}\n\n\n"
  clean.sh: |+
    #!/bin/bash

    rm -rf build/*
    rm -rf lib/*
    rm -rf bin/p* bin/uFld* bin/gen*
    rm -f .DS_Store
    rm -f  missions/*/.LastOpenedMOOSLogDirectory

    find . -name '.DS_Store'  -print -exec rm -rfv {} \;
    find . -name '*~'  -print -exec rm -rfv {} \;
    find . -name '#*'  -print -exec rm -rfv {} \;
    find . -name '*.moos++'  -print -exec rm -rfv {} \;

    find . -name 'MOOSLog*'  -print -exec rm -rfv {} \;

