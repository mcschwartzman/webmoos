apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f docker-compose.mathew.yaml convert
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: shoreside
  name: shoreside
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: shoreside
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f docker-compose.mathew.yaml convert
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: shoreside
    spec:
      containers:
        - env:
            - name: MPORT
              value: "9000"
            - name: PSHARE
              value: "9200"
          envFrom:
            - configMapRef:
                name: globals-env
          image: shoreside
          name: shoreside
          ports:
            - containerPort: 9000
              protocol: TCP
          volumeMounts:
            - mountPath: /git/moos-ivp-2680
              name: shoreside-cm0
      restartPolicy: Always
      volumes:
        - configMap:
            name: shoreside-cm0
          name: shoreside-cm0
