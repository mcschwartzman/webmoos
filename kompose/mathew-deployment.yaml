apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f docker-compose.mathew.yaml convert
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: mathew
  name: mathew
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mathew
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f docker-compose.mathew.yaml convert
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: mathew
    spec:
      containers:
        - env:
            - name: EXTENDBIN
              value: /git/moos-ivp-2680/bin
            - name: EXTENDLIB
              value: /git/moos-ivp-mcschwar/lib
            - name: IVP_BEHAVIOR_DIRS
              value: /git/moos-ivp-mcschwar/lib
            - name: MPORT
              value: "9002"
            - name: PSHARE
              value: "9202"
            - name: START_POS
              value: -12,-15,135
            - name: TMATE
              value: clayton
            - name: VIP
              value: 10.1.0.22
            - name: VNAME
              value: mathew
            - name: VROLE
              value: scout
          envFrom:
            - configMapRef:
                name: globals-env
          image: mathew
          name: mathew
          ports:
            - containerPort: 9002
              protocol: TCP
          volumeMounts:
            - mountPath: /git/moos-ivp-2680
              name: mathew-cm0
      restartPolicy: Always
      volumes:
        - configMap:
            name: mathew-cm0
          name: mathew-cm0
